<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b31">
  <meta name="description" content="OPO ENI旧链承接流程的浏览器模拟演示。不会发起真实转账或链上操作。">
  <title>OPO ENI 参与模拟测试</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#14213a;background:#f3f6fb;font-synthesis:none;text-rendering:optimizeLegibility}*{box-sizing:border-box}body{margin:0;min-width:320px}header{background:#101b31;color:#fff;padding:14px max(20px,calc((100vw - 1080px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}header strong{font-size:16px;letter-spacing:.04em}header label{display:flex;align-items:center;gap:8px;font-size:13px}header select{background:#fff;color:#14213a;border:0;border-radius:8px;padding:8px}main{max-width:1080px;margin:28px auto;padding:0 18px 32px}#eni-panel{display:grid;gap:16px}.pagehead,.panel,.note{border-radius:16px}.pagehead{background:linear-gradient(120deg,#1d3763,#196a82);color:#fff;padding:26px}.pagehead h1{margin:0 0 8px;font-size:clamp(24px,5vw,34px)}.pagehead p{margin:0;line-height:1.65}.panel{background:#fff;border:1px solid #e2e8f0;box-shadow:0 6px 20px #1324430a}.padded{padding:20px}.panel h2,.panel h3{margin-top:0}.panel p{line-height:1.7}.note{background:#fff7e6;color:#624500;border:1px solid #f4dda5}.eni-roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.eni-roles article{margin:0}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}button{border:0;border-radius:9px;cursor:pointer;font:inherit}.dark{background:#16375e;color:white}.soft{background:#eaf0f7;color:#173456}form{display:grid;gap:14px}form label{display:grid;gap:7px;font-weight:600}input,select{width:100%;padding:11px;border:1px solid #b9c5d4;border-radius:8px;background:#fff;color:#14213a;font:inherit}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.result{background:#edf6f8;border-radius:10px;padding:14px;line-height:1.7}.sub{color:#65748a;font-size:13px;line-height:1.6}.timeline{display:grid;gap:8px}.line{padding:12px;border-radius:8px;background:#f3f6fb}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:9px;border-bottom:1px solid #e2e8f0}.table-wrap{overflow:auto}footer{max-width:1080px;margin:0 auto;padding:0 18px 26px;color:#637087;font-size:12px;line-height:1.7}@media(max-width:600px){header{padding:12px 16px}main{margin:16px auto;padding:0 12px 24px}.padded{padding:16px}.pagehead{padding:20px}.toolbar button{flex:1 1 130px}}
  </style>
</head>
<body>
  <header><strong>OPO · ENI 测试演示</strong><label for="language">语言 / Language / 言語<select id="language"><option value="zh-CN">简体中文</option><option value="en">English</option><option value="ja">日本語</option></select></label></header>
  <main><div id="eni-panel" aria-live="polite"></div></main>
  <footer>测试环境：页面只在当前浏览器演示输入、估算和释放计划。不会连接钱包、生成真实收款地址、监听区块链、转移资产、销毁 ZC、发放 OPOC 或更改客户余额。请勿输入私钥、助记词或真实敏感资料。</footer>
  <script type="module">
    import { mountEni } from './assets/eni-participation.mjs';
    import { currentLanguage, setLanguage } from './assets/model-i18n.js';
    const panel = document.querySelector('#eni-panel');
    const language = document.querySelector('#language');
    mountEni(panel);
    language.value = currentLanguage();
    language.addEventListener('change', () => setLanguage(language.value));
  </script>
</body>
</html>
