</style></head><body><div id="app"></div><dialog id="modal"></dialog><div id="toast" class="toast" role="status" hidden></div><script>const PAGE='index';
'use strict';
const DBKEY='opo-central-v1',LANGKEY='opo-central-language',SESSION='opo-central-session',ADMIN='opo-central-admin';
let lang=localStorage.getItem(LANGKEY)||'zh';if(!['zh','en','ja'].includes(lang))lang='zh';
const L=(zh,en,ja)=>[zh,en,ja][['zh','en','ja'].indexOf(lang)];
const E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n).toFixed(2),round=n=>Math.round((Number(n)+Number.EPSILON)*100)/100,cap=n=>Math.floor(Math.round(n*100)/2)/100;

const seed=()=>({version:1,users:[],currentUser:null,cart:[],orders:[],ledger:[],exchanges:[],poolRuns:[],pool:0,settings:{rate:.01,minHolder:5000,poolRate:10},seq:1001,products:[
{id:1,n:['OPO 保温杯 500ml','OPO Insulated bottle 500ml','OPO 保温ボトル 500ml'],d:['轻巧随行，温暖常伴。日常办公与出行好物。','Everyday warmth, wherever you go. Made for work and travel.','仕事にも旅にも。毎日の温かさを持ち歩く。'],price:8.9,stock:168,cat:2,icon:'☕',color:'#eadbc9',on:true},
{id:2,n:['OPO 无线耳机','OPO Wireless headphones','OPO ワイヤレスヘッドホン'],d:['沉浸聆听，让日常多一点好声音。','Make every day sound a little better.','毎日の音を、もっと心地よく。'],price:19.9,stock:92,cat:0,icon:'🎧',color:'#e4e6f0',on:true},
{id:3,n:['OPO 帆布手提袋','OPO Canvas tote','OPO キャンバストート'],d:['轻盈百搭，装下生活的小美好。','A versatile carryall for your everyday essentials.','暮らしの小さな必需品を、軽やかに。'],price:12.9,stock:120,cat:1,icon:'👜',color:'#efe3d2',on:true},
{id:4,n:['OPO 护手霜','OPO Hand cream','OPO ハンドクリーム'],d:['日常护理，随身携带。','Everyday care in a travel-friendly size.','毎日のケアを、持ち歩けるサイズで。'],price:6.9,stock:70,cat:3,icon:'🧴',color:'#f4dddd',on:true},
{id:5,n:['OPO 精选茶礼','OPO Tea selection','OPO セレクトティー'],d:['留一点时间，享受一杯茶。','Take a moment for a comforting cup of tea.','一杯のお茶と、くつろぎの時間。'],price:15.9,stock:85,cat:4,icon:'🍵',color:'#e1eadb',on:true},
{id:6,n:['OPO 旅行收纳包','OPO Travel organizer','OPO トラベルポーチ'],d:['整齐收纳，轻松出发。','Keep it organized. Travel light.','すっきり収納して、気軽に出発。'],price:9.9,stock:110,cat:5,icon:'🎒',color:'#e0e9ed',on:true}]});
let db;try{db=JSON.parse(localStorage.getItem(DBKEY))||seed()}catch{db=seed()};
const uid=()=>localStorage.getItem(SESSION),user=()=>db.users.find(u=>u.id===uid()),pn=p=>p.n[['zh','en','ja'].indexOf(lang)],pd=p=>p.d?.[['zh','en','ja'].indexOf(lang)]||'',pby=id=>db.products.find(p=>p.id===Number(id));
const cart=()=>db.cart.filter(x=>x.owner===(uid()||'guest')),total=()=>round(cart().reduce((a,x)=>a+(pby(x.pid)?.price||0)*x.qty,0));
let tab=new URLSearchParams(location.search).get('tab')||'login',adminTab='products',activeCat=-1,query='',selectedSku='standard',quantity=1,pointDraft=0;

const stamp=t=>new Date(t).toLocaleString({zh:'zh-CN',en:'en-US',ja:'ja-JP'}[lang]);
const labels=()=>({index:L('首页','Home','ホーム'),login:L('登录 / 注册','Sign in / Register','ログイン / 登録'),product:L('商品详情','Product details','商品詳細'),cart:L('购物车','Cart','カート'),checkout:L('确认订单','Checkout','注文確認'),orders:L('我的订单','My orders','注文履歴'),points:L('我的积分','My points','ポイント'),admin:L('管理后台','Admin','管理画面'),exchange:L('ZC兑换OPOC','ZC to OPOC','ZCからOPOCへ')});

const tag=s=>`<span class="badge ${s==='refund'?'amber':''}">${statusText(s)}</span>`;
function shell(content){const ls=labels(),u=user();document.documentElement.lang={zh:'zh-CN',en:'en',ja:'ja'}[lang];document.title='OPO · '+ls[PAGE];document.getElementById('app').innerHTML=`<div class="demo">${L('OPO 1.0 · 全中心化本地演示 · 不发生真实付款、链上兑换或销毁','OPO 1.0 · Centralized local demo · No real payments, on-chain swaps or burns','OPO 1.0 · 中央管理ローカルデモ · 実際の決済・交換・バーンは行いません')}</div><header><div class="top"><a class="logo" href="index.html">OPO <span>${L('商城','MARKET','マーケット')}</span></a><form id="searchForm" class="search"><input name="q" value="${E(query)}" placeholder="${L('搜索好物，发现新生活','Find something for everyday life','暮らしのいいものを探す')}" aria-label="${L('搜索商品','Search products','商品検索')}"><button>${L('搜索','Search','検索')}</button></form><div class="top-tools"><select id="language" aria-label="${L('语言选择','Language','言語選択')}"><option value="zh" ${lang==='zh'?'selected':''}>${L('中文','Chinese','中国語')}</option><option value="en" ${lang==='en'?'selected':''}>${L('英文','English','英語')}</option><option value="ja" ${lang==='ja'?'selected':''}>${L('日文','Japanese','日本語')}</option></select>${u?`<span class="user-name">${E(u.name)}</span>${button(L('退出','Sign out','ログアウト'),'logout')}`:`<a href="login.html">${L('登录 / 注册','Sign in / Register','ログイン / 登録')}</a>`}</div></div><nav>${['index','cart','orders','points','exchange'].map(k=>`<a class="${PAGE===k?'active':''}" href="${k}.html">${ls[k]}${k==='cart'?` <small>${cart().reduce((a,x)=>a+x.qty,0)}</small>`:''}</a>`).join('')}<a href="admin.html" class="${PAGE==='admin'?'active':''}">${ls.admin}</a></nav></header><main class="max-w-7xl mx-auto">${content}</main><footer><div><b>OPO</b><p>${L('消费省 · 分享得 · 消费即积累','Shop smart · Share value · Collect points','お得に買う・紹介する・貯める')}</p></div><div class="footer-links">${['index','orders','points','exchange','admin'].map(k=>`<a href="${k}.html">${ls[k]}</a>`).join('')}</div><p class="muted">© 2026 OPO · ${L('仅保存当前浏览器数据，请勿输入真实密码或资金信息。','Data stays in this browser. Do not enter real passwords or financial information.','データはこのブラウザー内のみ。実際のパスワードや金融情報は入力しないでください。')}</p></footer>`}
function gate(){return `<section class="panel empty"><h1>${L('请先登录','Please sign in','ログインしてください')}</h1><p>${L('使用演示账号保存订单、余额和积分流水。','Use a demo account to save orders, balances and points.','デモアカウントで注文・残高・履歴を保存します。')}</p><a class="btn primary" href="login.html?next=${PAGE}">${L('前往登录','Go to sign in','ログインへ')}</a></section>`}
function cards(arr){return `<div class="products grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">${arr.map(p=>`<a class="product" href="product.html?id=${p.id}">${art(p)}<div class="product-body"><h3>${E(pn(p))}</h3><p class="muted">${L('商家直发 · 品质生活','Supplier direct · Everyday quality','直送・暮らしの品質')}</p><strong>${money(p.price)} <small>USDT</small></strong><div><span class="badge">${L('最多50%积分抵扣','Up to 50% with points','ポイント最大50%')}</span></div></div></a>`).join('')}</div>`}
function index(){if(!query)query=new URLSearchParams(location.search).get('q')||'';let list=db.products.filter(p=>p.on&&(activeCat<0||p.cat===activeCat)&&(!query||(pn(p)+' '+pd(p)).toLowerCase().includes(query.toLowerCase())));return `<section class="hero"><div><span>${L('OPO 品质生活','OPO LIVING','OPO 暮らし')}</span><h1>${L('好物好价，<br>积分也能花','Good finds.<br>More everyday value.','いいものを、<br>もっとお得に。')}</h1><p>${L('USDT支付，OPOC最多抵扣50%','Pay in USDT, use OPOC for up to 50%','USDTでお支払い、OPOCは最大50%まで')}</p><a class="btn white" href="#catalog">${L('发现今日好物','Discover today’s finds','おすすめを見る')} →</a></div><div class="hero-scene"><span>☕</span><b>${L('美好生活<br>一起拥有','Good life.<br>Better together.','いい暮らしを<br>一緒に。')}</b></div></section><div class="categories">${categories().map((n,i)=>`<button class="${activeCat===i?'selected':''}" data-action="category" data-id="${i}"><span>${['🎧','👕','🏠','🧴','🍵','✦'][i]}</span>${n}</button>`).join('')}</div><div class="heading" id="catalog"><div><h2>${L('精选好物','Everyday favorites','おすすめ商品')}</h2><p class="muted">${L('为日常挑选一点不同','Small finds that make a difference','毎日に、小さな違いを')}</p></div>${button(L('全部商品','All products','すべての商品'),'all')}</div>${list.length?cards(list):`<div class="panel empty">${L('没有匹配商品，请更换搜索或分类。','No matches. Try another search or category.','該当商品がありません。条件を変更してください。')}</div>`}<div class="note">${L('数字导购提示：8.90 USDT保温杯，最多使用4.45 OPOC。','Shopping tip: the 8.90 USDT bottle accepts up to 4.45 OPOC.','お買い物ヒント：8.90 USDTのボトルは4.45 OPOCまで利用可能。')}</div>`}
function login(){let reg=tab==='register';return `<section class="auth panel"><div class="eyebrow">${L('OPO 账户','OPO ACCOUNT','OPO アカウント')}</div><h1>${L('欢迎来到 OPO','Welcome to OPO','OPOへようこそ')}</h1><p class="muted">${L('从一件好物开始，积累美好生活。','Start with a good find. Build a better everyday.','いいものとの出会いから、豊かな毎日へ。')}</p><div class="tabs">${button(L('登录','Sign in','ログイン'),'loginTab','login',!reg?'primary':'')}${button(L('注册','Register','登録'),'loginTab','register',reg?'primary':'')}</div><form id="authForm" class="form">${reg?field(L('昵称','Display name','表示名'),'name','','text','required maxlength="30"'):''}${field(L('账号（字母、数字或下划线）','Username (letters, numbers or underscores)','アカウント名（英数字・_）'),'account','','text','required pattern="[A-Za-z0-9_]{3,32}" autocomplete="username"')}${field(L('演示密码（至少6位）','Demo password (6+ characters)','デモパスワード（6文字以上）'),'password','','password','required minlength="6" maxlength="128" autocomplete="off"')}${reg?field(L('确认密码','Confirm password','パスワード確認'),'confirm','','password','required minlength="6" autocomplete="off"'):''}<button class="btn primary" type="submit">${reg?L('创建演示账号','Create demo account','デモアカウント作成'):L('登录','Sign in','ログイン')}</button></form><div class="note">${L('新账号赠送演示余额：1000 USDT、100 OPOC、5000 ZC。仅用于测试，无真实价值。','New accounts receive demo balances: 1000 USDT, 100 OPOC and 5000 ZC. For testing only, with no real value.','新規アカウントにはデモ残高1000 USDT、100 OPOC、5000 ZCを付与。実際の価値はありません。')}</div></section>`}
function product(){let p=pby(new URLSearchParams(location.search).get('id')||1);if(!p||!p.on)return `<div class="panel empty">${L('商品不存在或已下架','Product unavailable','商品は現在購入できません')} <a href="index.html">${L('返回首页','Back home','ホームへ')}</a></div>`;return `<div class="breadcrumb"><a href="index.html">${labels().index}</a> / ${categories()[p.cat]} / ${E(pn(p))}</div><section class="panel detail"><div>${art(p)}</div><div><span class="badge">${L('商家直发','Supplier direct','直送')}</span><h1>${E(pn(p))}</h1><p class="muted">${E(pd(p))}</p><div class="price">${money(p.price)} <small>USDT</small></div><form id="productForm" class="form"><input type="hidden" name="pid" value="${p.id}"><label>${L('规格','SKU','仕様')}<select name="sku"><option value="standard" ${selectedSku==='standard'?'selected':''}>${skuName('standard')}</option><option value="gift" ${selectedSku==='gift'?'selected':''}>${skuName('gift')} · ${L('同价','Same price','同額')}</option></select></label>${field(L('数量','Quantity','数量'),'qty',quantity,'number',`required min="1" max="${p.stock}" step="1"`)}${field(L('OPOC抵扣（可选）','OPOC to use (optional)','OPOC利用数（任意）'),'points',pointDraft,'number','min="0" step="0.01"')}<div id="productQuote" class="note"></div><div class="actions"><button class="btn" type="submit" value="cart">${L('加入购物车','Add to cart','カートに追加')}</button><button class="btn primary" type="submit" value="buy">${L('立即购买','Buy now','今すぐ購入')}</button></div></form><p class="muted">${L('库存','Stock','在庫')} ${p.stock} · ${L('积分最多抵扣商品金额50%','Points cover up to 50% of item value','ポイントは商品金額の50%まで')}</p></div></section>`}
function cartPage(){let items=cart();return `<div class="heading"><h1>${labels().cart}</h1><a href="index.html">${L('继续购物','Continue shopping','買い物を続ける')} →</a></div>${items.length?`<section class="panel">${items.map(x=>{let p=pby(x.pid);return `<div class="cart-row">${art(p)}<div class="grow"><a href="product.html?id=${p.id}"><b>${E(pn(p))}</b></a><div class="muted">${skuName(x.sku)} · ${money(p.price)} USDT</div><span class="small">${p.on?L('可购买','Available','購入可'):L('已下架，请删除','Unavailable, please remove','販売終了・削除してください')}</span></div><label class="qty-label">${L('数量','Qty','数量')}<input type="number" value="${x.qty}" min="1" max="${p.stock}" step="1" data-cartqty="${x.id}" aria-label="${L('商品数量','Item quantity','商品数量')}"></label><b>${money(p.price*x.qty)} USDT</b>${button(L('删除','Remove','削除'),'remove',x.id)}</div>`}).join('')}<div class="summary"><div><span>${L('合计','Total','合計')}</span><strong>${money(total())} USDT</strong><p class="muted">${L('积分抵扣将在结算时确认','Confirm points at checkout','ポイント利用は注文確認時に確定')}</p></div><a class="btn primary" href="checkout.html">${L('去结算','Checkout','注文確認へ')} →</a></div></section>`:`<section class="panel empty"><h2>${L('购物车还是空的','Your cart is empty','カートは空です')}</h2><a class="btn primary" href="index.html">${L('去逛逛','Browse products','商品を見る')}</a></section>`}`}
function checkout(){let u=user();if(!u)return gate();if(!cart().length)return cartPage();let a=u.address||{},hint=Math.min(cart().reduce((s,x)=>s+(x.points||0),0),cap(total()),u.opoc);return `<h1>${labels().checkout}</h1><div class="checkout-grid"><section class="panel"><form id="checkoutForm" class="form"><h2>${L('收货地址','Shipping address','配送先')}</h2><div class="two">${field(L('收货人','Recipient','受取人'),'name',a.name||u.name,'text','required maxlength="60"')}${field(L('联系电话','Phone','電話番号'),'phone',a.phone||'','tel','required maxlength="30"')}</div>${field(L('国家 / 地区','Country / Region','国・地域'),'country',a.country||'','text','required maxlength="60"')}${field(L('详细地址','Street address','住所'),'address',a.address||'','text','required maxlength="200"')}<h2>${L('支付方式','Payment method','支払方法')}</h2><label>${L('选择支付方式','Choose payment method','支払方法を選択')}<select name="mode"><option value="mixed">${L('组合支付 USDT + OPOC','Mixed USDT + OPOC','併用 USDT + OPOC')}</option><option value="usdt">USDT</option><option value="opoc" disabled>${L('纯OPOC不可用（抵扣上限50%）','OPOC only unavailable (50% cap)','OPOCのみは不可（上限50%）')}</option></select></label>${field(L('OPOC抵扣（可选）','OPOC to use (optional)','OPOC利用数（任意）'),'points',money(hint),'number',`min="0" step="0.01" max="${Math.min(cap(total()),u.opoc)}"`)}<div id="checkoutQuote" class="note"></div><label class="check"><input type="checkbox" name="agree" required>${L('确认地址和金额，执行本地模拟支付','Confirm address and amount for a local demo payment','住所と金額を確認し、ローカルデモ決済を実行')}</label><button class="btn primary" type="submit">${L('确认模拟支付','Confirm demo payment','デモ決済を確認')}</button></form></section><aside class="panel"><h2>${L('订单摘要','Order summary','注文内容')}</h2>${cart().map(x=>`<div class="row"><span>${E(pn(pby(x.pid)))} × ${x.qty}</span><b>${money(pby(x.pid).price*x.qty)}</b></div>`).join('')}<div class="row"><b>${L('合计','Total','合計')}</b><b>${money(total())} USDT</b></div><p>${L('可用余额','Available balance','利用可能残高')}: ${money(u.usdt)} USDT / ${money(u.opoc)} OPOC</p><p class="muted">${L('不调用钱包。USDT和OPOC均为本机演示余额。','No wallet is called. USDT and OPOC are local demo balances.','ウォレットには接続しません。すべてローカルのデモ残高です。')}</p></aside></div>`}
function orderActions(o,admin=false){if(admin)return (o.status==='paid'?button(L('发货','Ship','発送'),'ship',o.id):o.status==='refund'?button(L('同意全额退款','Approve full refund','全額返金を承認'),'refundApprove',o.id):'')+button(L('详情','Details','詳細'),'detailOrder',o.id);return (o.status==='shipped'?button(L('确认收货','Confirm receipt','受取確認'),'receipt',o.id,'primary'):'')+(['paid','shipped'].includes(o.status)?button(L('申请退款','Request refund','返金申請'),'refundRequest',o.id):'')+button(L('详情','Details','詳細'),'detailOrder',o.id)}
function orders(){if(!user())return gate();let arr=db.orders.filter(o=>o.user===uid());return `<div class="heading"><h1>${labels().orders}</h1><a href="index.html">${L('继续购物','Continue shopping','買い物を続ける')}</a></div>${arr.length?arr.map(o=>`<section class="panel"><div class="row"><b>${o.id}</b>${tag(o.status)}</div>${o.items.map(x=>`<div class="row"><span>${E(x.n[['zh','en','ja'].indexOf(lang)])} · ${skuName(x.sku)} × ${x.qty}</span><b>${money(x.price*x.qty)} USDT</b></div>`).join('')}<div class="row"><span>${stamp(o.at)}</span><b>${money(o.usdt)} USDT + ${money(o.opoc)} OPOC</b></div><div class="actions end">${orderActions(o)}</div></section>`).join(''):`<section class="panel empty">${L('暂无订单','No orders yet','注文はまだありません')} <a href="index.html">${L('去购物','Shop now','商品を見る')}</a></section>`}`}
const ledgerText=t=>({welcome:L('新账号演示赠送','Demo welcome credit','デモ登録特典'),pay:L('商品支付','Order payment','商品決済'),refund:L('原路退款','Original-method refund','元の方法で返金'),exchange:L('ZC兑换到账','ZC exchange credit','ZC交換による付与')})[t]||t;
function points(){let u=user();if(!u)return gate();return `<h1>${labels().points}</h1><section class="balance"><span>${L('可用OPOC积分','Available OPOC','利用可能OPOC')}</span><strong>${money(u.opoc)}</strong><p>${L('1 OPOC = 1 USDT商品抵扣力；最多抵扣50%','1 OPOC offsets 1 USDT of goods; maximum 50%','1 OPOCで商品代金1 USDTを充当・上限50%')}</p><a class="btn white" href="exchange.html">${labels().exchange} →</a></section><section class="panel"><h2>${L('积分流水','Points history','ポイント履歴')}</h2>${table([L('时间','Time','日時'),L('类型','Type','種類'),L('变动','Change','増減'),L('关联记录','Reference','参照')],db.ledger.filter(x=>x.user===u.id).map(x=>[stamp(x.at),ledgerText(x.type),`${x.amount>0?'+':''}${money(x.amount)} OPOC`,E(x.ref)]))}</section>`}
function exchange(){let u=user();if(!u)return gate();return `<div class="heading"><h1>${labels().exchange}</h1><a href="points.html">${L('查看积分','View points','ポイントを見る')} →</a></div><div class="two"><section class="panel"><h2>${L('单向兑换','One-way exchange','一方向の交換')}</h2><div class="row"><span>${L('可用ZC','Available ZC','利用可能ZC')}</span><b>${u.zc.toFixed(6)} ZC</b></div><div class="row"><span>${L('演示价格','Demo rate','デモ価格')}</span><b>1 ZC = ${db.settings.rate} USDT</b></div><form id="exchangeForm" class="form">${field(L('输入ZC数量','ZC amount','ZC数量'),'zc','','number',`required min="0.000001" max="${u.zc}" step="0.000001"`)}<div id="exchangeQuote" class="note"></div><label class="check"><input name="agree" type="checkbox" required>${L('同意扣除演示ZC并按2%费率兑换','Agree to deduct demo ZC and exchange with a 2% fee','デモZCを差し引き、2%手数料で交換することに同意')}</label><button class="btn primary">${L('确认模拟兑换','Confirm demo exchange','デモ交換を確認')}</button></form></section><section class="panel"><h2>${L('兑换规则','Exchange rules','交換ルール')}</h2><p>${L('到账OPOC = ZC数量 × 演示价格 × 98%，向下保留两位小数。','Net OPOC = ZC amount × demo rate × 98%, rounded down to two decimals.','受取OPOC = ZC数量 × デモ価格 × 98%。小数点以下2桁に切り捨て。')}</p><p>${L('仅ZC兑换OPOC，不支持反向兑换。全额输入ZC从演示余额扣除，并记录模拟销毁；没有真实链上销毁。','Only ZC to OPOC is supported. The full ZC input is deducted and recorded as a simulated burn. No on-chain burn occurs.','ZCからOPOCへの交換のみ。入力ZC全額をデモ残高から差し引き、模擬バーンを記録。実際のバーンは行いません。')}</p><p class="muted">${L('价格由后台手动设置，不抓取行情。锁仓认购与365天释放不包含在本次9页范围内；没有重新发放1.5倍。','The rate is set manually in Admin. Subscription lockups and 365-day vesting are outside these nine pages. No additional 1.5× allocation is created.','価格は管理画面で手動設定。今回の9ページには申込ロックと365日リリースは含みません。追加の1.5倍付与はありません。')}</p></section></div><section class="panel"><h2>${L('兑换记录','Exchange history','交換履歴')}</h2>${table([L('时间','Time','日時'),'ZC',L('手续费等值','Fee equivalent','手数料相当'),'OPOC'],db.exchanges.filter(x=>x.user===u.id).map(x=>[stamp(x.at),x.zc.toFixed(6),x.fee.toFixed(6)+' USDT',money(x.net)]))}</section>`}
function table(head,rows){return `<div class="table-wrap"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${head.length}" class="empty">${L('暂无记录','No records','記録なし')}</td></tr>`}</tbody></table></div>`}
const isAdmin=()=>localStorage.getItem(ADMIN)==='yes';
function admin(){if(!isAdmin())return `<section class="auth panel"><h1>${labels().admin}</h1><p class="note">${L('演示密码：admin123。纯前端验证可被绕过，不用于正式系统。','Demo password: admin123. Front-end validation can be bypassed; not for production.','デモパスワード：admin123。フロントのみの検証は回避可能で、本番用ではありません。')}</p><form id="adminLogin" class="form">${field(L('管理密码','Admin password','管理パスワード'),'password','','password','required')}<button class="btn primary">${L('进入后台','Enter admin','管理画面へ')}</button></form></section>`;let tabs={products:L('商品管理','Products','商品管理'),orders:L('订单管理','Orders','注文管理'),settings:L('参数设置','Settings','設定'),pool:L('奖金池','Reward pool','報酬プール')};let body='';if(adminTab==='products')body=`<div class="heading"><h2>${tabs.products}</h2>${button(L('新增商品','Add product','商品追加'),'editProduct','','primary')}</div>${table([L('商品','Product','商品'),L('价格','Price','価格'),L('库存','Stock','在庫'),L('状态','Status','状態'),L('操作','Actions','操作')],db.products.map(p=>[E(pn(p)),money(p.price)+' USDT',p.stock,p.on?L('上架','Listed','販売中'):L('下架','Unlisted','非公開'),button(L('编辑','Edit','編集'),'editProduct',p.id)+button(p.on?L('下架','Unlist','非公開'):L('上架','List','公開'),'toggleProduct',p.id)]))}`;
if(adminTab==='orders')body=`<h2>${tabs.orders}</h2>${table([L('订单','Order','注文'),L('客户','Customer','顧客'),L('支付','Payment','支払い'),L('状态','Status','状態'),L('操作','Actions','操作')],db.orders.map(o=>[o.id,E(db.users.find(x=>x.id===o.user)?.name||''),money(o.usdt)+' USDT + '+money(o.opoc)+' OPOC',tag(o.status),orderActions(o,true)]))}`;
if(adminTab==='settings')body=`<h2>${tabs.settings}</h2><form id="settingsForm" class="form narrow">${field(L('ZC演示价格（USDT）','ZC demo rate (USDT)','ZCデモ価格（USDT）'),'rate',db.settings.rate,'number','required min="0.000001" max="1000000" step="0.000001"')}${field(L('奖金资格持仓价值（USDT）','Minimum holding value for pool (USDT)','報酬対象の最低保有額（USDT）'),'minHolder',db.settings.minHolder,'number','required min="0" max="1000000000" step="0.01"')}<div class="note">${L('固定规则：OPOC上限50%，兑换手续费2%，完成订单USDT实付的10%计入演示奖金池。旧订单、旧兑换记录不随参数变更重算。','Fixed rules: 50% OPOC cap, 2% exchange fee, 10% of completed-order USDT goes to the demo pool. Existing orders and exchanges are not recalculated.','固定ルール：OPOC上限50%、交換手数料2%、完了注文のUSDT実払額10%をデモ報酬プールへ。既存記録は再計算しません。')}</div><button class="btn primary">${L('保存参数','Save settings','設定を保存')}</button></form>`;
if(adminTab==='pool')body=`<div class="balance"><span>${L('待分配奖金池','Available reward pool','分配可能報酬プール')}</span><strong>${money(db.pool)} USDT</strong></div><p>${L('来源为完成订单USDT的10%。手动触发时，按达到资格门槛用户的ZC余额占比分配，以当前演示价换算ZC到账；没有真实交易或利润达标核验。','Funded by 10% of completed-order USDT. Manual distribution is proportional to eligible users’ ZC balances, paid as demo ZC at the current rate. No real transaction or profit verification.','完了注文USDTの10%を原資とし、対象ユーザーのZC保有比率で分配。現在のデモ価格でZCに換算。実取引や利益条件の検証はありません。')}</p><div class="note">${L('这只是奖金池前端试算，不代表已实现完整金库、LP或正式持币分红制度。无合格用户时保留池余额。','This is a front-end pool simulation, not a full treasury, LP or production dividend system. Funds remain when no user qualifies.','フロントの試算であり、正式な金庫・LP・配当制度ではありません。対象者がいない場合は残高を保持します。')}</div>${button(L('预览并触发分配','Preview distribution','分配をプレビュー'),'poolPreview','','primary')}<h2 style="margin-top:25px">${L('分配批次','Distribution batches','分配履歴')}</h2>${table([L('时间','Time','日時'),L('总额','Amount','総額'),L('人数','Recipients','人数')],db.poolRuns.map(r=>[stamp(r.at),money(r.amount)+' USDT',r.recipients.length]))}`;
return `<div class="heading"><h1>${labels().admin}</h1>${button(L('退出管理','Admin sign out','管理ログアウト'),'adminLogout')}</div><div class="tabs">${Object.entries(tabs).map(([k,v])=>button(v,'adminTab',k,adminTab===k?'primary':'')).join('')}</div><section class="panel">${body}</section>`}
function render(){const f={index,login,product,cart:cartPage,checkout,orders,points,admin,exchange};shell(f[PAGE]());updateQuote();save()}
function updateQuote(){let f=document.getElementById('productForm');if(f){let p=pby(f.elements.pid.value),qty=Number(f.elements.qty.value),q=Number(f.elements.points.value),amount=round(p.price*qty),valid=Number.isInteger(qty)&&qty>0&&qty<=p.stock&&Number.isFinite(q)&&q>=0&&q<=cap(amount)&&Math.abs(q*100-Math.round(q*100))<1e-7;f.elements.points.max=cap(amount);f.elements.points.setCustomValidity(valid?'':L('数量或积分无效，最多抵扣50%','Invalid quantity or points; 50% maximum','数量またはポイントが無効です。上限50%'));selectedSku=f.elements.sku.value;quantity=qty;pointDraft=q;document.getElementById('productQuote').textContent=valid?L(`合计${money(amount)} USDT，最多${money(cap(amount))} OPOC；预计实付${money(amount-q)} USDT + ${money(q)} OPOC`,`Total ${money(amount)} USDT; max ${money(cap(amount))} OPOC. Pay ${money(amount-q)} USDT + ${money(q)} OPOC`,`合計${money(amount)} USDT、上限${money(cap(amount))} OPOC。支払${money(amount-q)} USDT + ${money(q)} OPOC`):L('请检查数量及积分抵扣','Check quantity and points','数量とポイントをご確認ください')}
f=document.getElementById('checkoutForm');if(f){let inp=f.elements.points,mode=f.elements.mode.value;if(mode==='usdt'){inp.value=0;inp.disabled=true}else inp.disabled=false;let q=Number(inp.value),u=user(),valid=Number.isFinite(q)&&q>=0&&q<=Math.min(cap(total()),u.opoc)&&Math.abs(q*100-Math.round(q*100))<1e-7;inp.setCustomValidity(valid?'':L('积分超出50%或余额不足','Points exceed 50% or available balance','ポイントが50%または残高を超えています'));document.getElementById('checkoutQuote').textContent=valid?L(`实付 ${money(total()-q)} USDT + ${money(q)} OPOC；最多抵扣 ${money(Math.min(cap(total()),u.opoc))} OPOC`,`Pay ${money(total()-q)} USDT + ${money(q)} OPOC; maximum ${money(Math.min(cap(total()),u.opoc))} OPOC`,`支払 ${money(total()-q)} USDT + ${money(q)} OPOC。上限${money(Math.min(cap(total()),u.opoc))} OPOC`):L('请减少积分用量','Please reduce points','ポイント利用数を減らしてください')}
f=document.getElementById('exchangeForm');if(f){let q=Number(f.elements.zc.value),gross=q*db.settings.rate,fee=gross*.02,net=Math.floor((gross-fee+1e-9)*100)/100;document.getElementById('exchangeQuote').textContent=L(`手续费2%：${(fee||0).toFixed(6)} USDT等值；预计到账 ${money(net||0)} OPOC`,`2% fee: ${(fee||0).toFixed(6)} USDT equivalent; receive ${money(net||0)} OPOC`,`手数料2%：${(fee||0).toFixed(6)} USDT相当。受取予定${money(net||0)} OPOC`)}}
function ledger(u,type,amount,ref){db.ledger.unshift({user:u.id,type,amount:round(amount),ref,at:new Date().toISOString()})}
async function hash(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
function poolPlan(){let users=db.users.filter(u=>u.zc>0&&u.zc*db.settings.rate>=db.settings.minHolder),sum=users.reduce((a,u)=>a+u.zc,0);if(!users.length||db.pool<=0)return null;let units=Math.floor(db.pool/db.settings.rate*1e6),remaining=units;return {amount:db.pool,rate:db.settings.rate,recipients:users.map((u,i)=>{let n=i===users.length-1?remaining:Math.floor(units*u.zc/sum);remaining-=n;return {id:u.id,name:u.name,zc:n/1e6}})}}
document.addEventListener('input',e=>{if(e.target.closest('#productForm,#checkoutForm,#exchangeForm'))updateQuote()});
document.addEventListener('change',e=>{if(e.target.id==='language'){lang=e.target.value;localStorage.setItem(LANGKEY,lang);close();render();return}if(e.target.closest('#productForm,#checkoutForm'))updateQuote();if(e.target.dataset.cartqty){let x=cart().find(x=>x.id===e.target.dataset.cartqty),n=Number(e.target.value),p=pby(x.pid),others=cart().filter(y=>y.pid===p.id&&y.id!==x.id).reduce((a,y)=>a+y.qty,0);if(!Number.isInteger(n)||n<1||n+others>p.stock){flash(L('数量无效或超过库存','Invalid quantity or insufficient stock','数量が無効、または在庫不足です'));e.target.value=x.qty;return}x.qty=n;x.points=Math.min(x.points||0,cap(n*p.price));save();render()}});
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id,u=user();if(a==='close'){close();return}if(['adminTab','editProduct','toggleProduct','ship','refundApprove','poolPreview','poolExecute'].includes(a)&&!isAdmin()){flash(L('请登录管理后台','Sign in to admin','管理画面にログインしてください'));return}
if(a==='logout'){localStorage.removeItem(SESSION);location.href='index.html';return}if(a==='adminLogout'){localStorage.removeItem(ADMIN);render();return}if(a==='loginTab'){tab=id;render();return}if(a==='category'){activeCat=Number(id);query='';render();return}if(a==='all'){activeCat=-1;query='';history.replaceState(null,'','index.html');render();return}if(a==='remove'){db.cart=db.cart.filter(x=>!(x.id===id&&x.owner===(uid()||'guest')));save();render();return}if(a==='adminTab'){adminTab=id;render();return}
if(a==='editProduct'){let p=pby(id)||{id:'',n:['','',''],d:['','',''],price:8.9,stock:10,cat:2};modal(L('商品编辑','Edit product','商品編集'),`<form id="editProductForm" class="form"><input type="hidden" name="id" value="${p.id}">${field(L('中文商品名','Chinese product name','中国語商品名'),'zh',p.n[0],'text','required maxlength="80"')}${field(L('英文商品名','English product name','英語商品名'),'en',p.n[1],'text','required maxlength="80"')}${field(L('日文商品名','Japanese product name','日本語商品名'),'ja',p.n[2],'text','required maxlength="80"')}<div class="two">${field(L('售价USDT','Price USDT','価格USDT'),'price',p.price,'number','required min="0.01" max="1000000" step="0.01"')}${field(L('库存','Stock','在庫'),'stock',p.stock,'number','required min="0" max="1000000" step="1"')}</div><label>${L('分类','Category','カテゴリー')}<select name="cat">${categories().map((n,i)=>`<option value="${i}" ${i===p.cat?'selected':''}>${n}</option>`).join('')}</select></label><button class="btn primary">${L('保存','Save','保存')}</button></form>`);return}
if(a==='toggleProduct'){let p=pby(id);p.on=!p.on;save();render();return}
let o=db.orders.find(x=>x.id===id);if(['receipt','refundRequest','detailOrder'].includes(a)&&(!o||(!isAdmin()&&o.user!==u?.id))){flash(L('无权访问订单','Order access denied','注文へのアクセス権がありません'));return}
if(a==='detailOrder'){modal(o.id,`<p>${tag(o.status)} · ${stamp(o.at)}</p><p>${money(o.usdt)} USDT + ${money(o.opoc)} OPOC</p><p>${L('地址','Address','住所')}: ${E(o.address.name)} · ${E(o.address.phone)} · ${E(o.address.country)} ${E(o.address.address)}</p><p>${L('物流单号','Tracking','追跡番号')}: ${E(o.tracking||L('暂无','Not available','未登録'))}</p><p>${L('退款原因','Refund reason','返金理由')}: ${E(o.reason||L('无','None','なし'))}</p>`);return}
if(a==='ship'&&o?.status==='paid'){modal(L('订单发货','Ship order','注文発送'),`<form id="shipForm" class="form"><input name="id" type="hidden" value="${o.id}">${field(L('物流单号','Tracking number','追跡番号'),'tracking','','text','required maxlength="80"')}<button class="btn primary">${L('确认发货','Confirm shipment','発送を確認')}</button></form>`);return}
if(a==='receipt'&&o?.status==='shipped'&&o.user===u?.id){modal(L('确认收货','Confirm receipt','受取確認'),`<p>${L('确认收到商品后，订单完成并计入演示奖金池。','Confirm receipt to complete the order and fund the demo pool.','受取を確認すると注文が完了し、デモ報酬プールへ計上します。')}</p>${button(L('确认','Confirm','確認'),'receiptConfirm',o.id,'primary')}`);return}
if(a==='receiptConfirm'&&o?.status==='shipped'&&o.user===u?.id){o.status='completed';o.poolAmount=round(o.usdt*.1);db.pool=round(db.pool+o.poolAmount);save();close();render();return}
if(a==='refundRequest'&&['paid','shipped'].includes(o?.status)&&o.user===u?.id){modal(L('申请退款','Request refund','返金申請'),`<form id="refundForm" class="form"><input type="hidden" name="id" value="${o.id}">${field(L('退款原因','Reason','理由'),'reason','','text','required maxlength="200"')}<button class="btn primary">${L('提交申请','Submit request','申請')}</button></form>`);return}
if(a==='refundApprove'&&o?.status==='refund'){modal(L('全额原路退款','Full original-method refund','全額返金'),`<p>${money(o.usdt)} USDT + ${money(o.opoc)} OPOC</p>${button(L('确认退款','Confirm refund','返金を確認'),'refundConfirm',o.id,'primary')}`);return}
if(a==='refundConfirm'&&isAdmin()&&o?.status==='refund'){let buyer=db.users.find(u=>u.id===o.user);buyer.usdt=round(buyer.usdt+o.usdt);buyer.opoc=round(buyer.opoc+o.opoc);o.status='refunded';o.items.forEach(x=>{let p=pby(x.pid);if(p)p.stock+=x.qty});ledger(buyer,'refund',o.opoc,o.id);save();close();render();return}
if(a==='poolPreview'){let plan=poolPlan();if(!plan||plan.recipients.every(r=>r.zc===0)){flash(L('奖金池为空或没有达到门槛的用户','Pool is empty or no user qualifies','プールが空、または対象者がいません'));return}modal(L('确认奖金分配','Confirm reward distribution','報酬分配の確認'),`<p>${money(plan.amount)} USDT → ${(plan.amount/plan.rate).toFixed(6)} ZC</p>${table([L('用户','User','ユーザー'),'ZC'],plan.recipients.map(r=>[E(r.name),r.zc.toFixed(6)]))}${button(L('执行本地模拟分配','Execute demo distribution','デモ分配を実行'),'poolExecute','','primary')}`);return}
if(a==='poolExecute'){let plan=poolPlan();if(!plan)return;plan.recipients.forEach(r=>{let u=db.users.find(u=>u.id===r.id);u.zc=Number((u.zc+r.zc).toFixed(6))});db.pool=0;db.poolRuns.unshift({...plan,at:new Date().toISOString()});save();close();render();return}
});
document.addEventListener('submit',async e=>{e.preventDefault();let f=e.target,d=new FormData(f),str=k=>String(d.get(k)||'').trim(),n=k=>Number(d.get(k));
if(f.getAttribute('id')==='searchForm'){location.href='index.html?q='+encodeURIComponent(str('q'));return}
if(f.getAttribute('id')==='authForm'){let account=str('account').toLowerCase(),pass=String(d.get('password')||'');if(!/^[a-z0-9_]{3,32}$/.test(account)||pass.length<6)return;let u=db.users.find(x=>x.account===account);try{if(tab==='register'){if(u){flash(L('账号已存在','Username already exists','登録済みのアカウントです'));return}if(pass!==String(d.get('confirm'))){flash(L('两次密码不一致','Passwords do not match','パスワードが一致しません'));return}if(!str('name'))return;let salt=crypto.randomUUID();u={id:'U-'+Date.now(),name:str('name'),account,salt,passwordHash:await hash(salt+pass),usdt:1000,opoc:100,zc:5000};db.users.push(u);ledger(u,'welcome',100,'DEMO')}else{if(!u||u.passwordHash!==await hash(u.salt+pass)){flash(L('账号或密码错误','Incorrect username or password','アカウント名またはパスワードが違います'));return}}db.cart.filter(x=>x.owner==='guest').forEach(x=>x.owner=u.id);localStorage.setItem(SESSION,u.id);save();let next=new URLSearchParams(location.search).get('next');location.href=(['index','cart','checkout','orders','points','exchange'].includes(next)?next:'index')+'.html'}catch{flash(L('浏览器不支持本地密码摘要，请用新版Edge或Chrome。','Use a recent Edge or Chrome with local cryptography support.','暗号機能に対応した新しいEdgeまたはChromeをご利用ください。'))}return}
if(f.getAttribute('id')==='productForm'){let p=pby(n('pid')),qty=n('qty'),q=n('points'),owner=uid()||'guest';if(!p?.on||!Number.isInteger(qty)||qty<1||!Number.isFinite(q)||q<0||q>cap(p.price*qty)||Math.abs(q*100-Math.round(q*100))>1e-7)return;let current=cart().filter(x=>x.pid===p.id).reduce((a,x)=>a+x.qty,0);if(current+qty>p.stock){flash(L('购物车数量超过库存','Cart quantity exceeds stock','カート数量が在庫を超えています'));return}db.cart.push({id:crypto.randomUUID(),owner,pid:p.id,qty,sku:str('sku')==='gift'?'gift':'standard',points:q});save();if(e.submitter?.value==='buy')location.href='checkout.html';else{flash(L('已加入购物车','Added to cart','カートに追加しました'));render()}return}
if(f.getAttribute('id')==='checkoutForm'){let u=user();if(!u)return;let mode=str('mode'),q=mode==='usdt'?0:n('points'),amount=total(),cash=round(amount-q);if(!['usdt','mixed'].includes(mode)||!Number.isFinite(q)||q<0||q>cap(amount)||q>u.opoc||cash>u.usdt||Math.abs(q*100-Math.round(q*100))>1e-7||!d.get('agree')||!cart().length){flash(L('支付金额无效、超出50%或余额不足','Invalid payment, over 50% cap or insufficient balance','金額が無効、50%超過、または残高不足です'));return}if(!['name','phone','country','address'].every(k=>str(k))){flash(L('请填写完整地址','Complete the address','住所をすべて入力してください'));return}let counts={};cart().forEach(x=>counts[x.pid]=(counts[x.pid]||0)+x.qty);if(Object.entries(counts).some(([id,qty])=>!pby(id)?.on||qty>pby(id).stock)){flash(L('商品下架或库存不足，请返回购物车','Product unavailable or insufficient stock. Return to cart.','販売終了または在庫不足です。カートに戻ってください。'));return}let address=Object.fromEntries(['name','phone','country','address'].map(k=>[k,str(k)]));let items=cart().map(x=>({...x,n:[...pby(x.pid).n],price:pby(x.pid).price})),id='OPO-'+db.seq++;db.orders.unshift({id,user:u.id,items,address,total:amount,usdt:cash,opoc:round(q),status:'paid',at:new Date().toISOString(),tracking:'',rule:'OPOC50-v1'});u.usdt=round(u.usdt-cash);u.opoc=round(u.opoc-q);u.address=address;Object.entries(counts).forEach(([id,qty])=>pby(id).stock-=qty);ledger(u,'pay',-q,id);db.cart=db.cart.filter(x=>x.owner!==u.id);save();location.href='orders.html';return}
if(f.getAttribute('id')==='exchangeForm'){let u=user(),q=n('zc'),rate=db.settings.rate;if(!u||!Number.isFinite(q)||q<=0||q>u.zc||Math.abs(q*1e6-Math.round(q*1e6))>1e-5||!d.get('agree')){flash(L('ZC数量无效或余额不足','Invalid ZC amount or insufficient balance','ZC数量が無効、または残高不足です'));return}let gross=q*rate,fee=gross*.02,net=Math.floor((gross-fee+1e-9)*100)/100;if(net<.01){flash(L('到账积分不足0.01，请增加数量','Net points below 0.01. Increase the amount.','受取が0.01未満です。数量を増やしてください。'));return}u.zc=Number((u.zc-q).toFixed(6));u.opoc=round(u.opoc+net);let id='EX-'+crypto.randomUUID();db.exchanges.unshift({id,user:u.id,zc:q,gross,fee,net,rate,burnedDemo:q,at:new Date().toISOString()});ledger(u,'exchange',net,id);save();render();flash(L('模拟兑换完成，ZC扣减并记录销毁','Demo exchange complete; ZC deducted and burn recorded','デモ交換完了。ZCを差し引き、模擬バーンを記録しました'));return}
if(f.getAttribute('id')==='adminLogin'){if(str('password')==='admin123'){localStorage.setItem(ADMIN,'yes');render()}else flash(L('管理密码错误','Incorrect admin password','管理パスワードが違います'));return}
if(['editProductForm','shipForm','settingsForm'].includes(f.getAttribute('id'))&&!isAdmin())return;
if(f.getAttribute('id')==='editProductForm'){let price=n('price'),stock=n('stock'),cat=n('cat');if(!['zh','en','ja'].every(k=>str(k))||!Number.isFinite(price)||price<=0||price>1e6||!Number.isInteger(stock)||stock<0||stock>1e6||!Number.isInteger(cat)||cat<0||cat>5)return;let p=pby(str('id')),data={n:[str('zh'),str('en'),str('ja')],price:round(price),stock,cat};if(p)Object.assign(p,data);else db.products.push({...data,id:Math.max(...db.products.map(x=>x.id))+1,d:['','',''],icon:'📦',color:'#eee5dc',on:false});save();close();render();return}
if(f.getAttribute('id')==='shipForm'){let o=db.orders.find(x=>x.id===str('id'));if(o?.status!=='paid'||!str('tracking'))return;o.tracking=str('tracking');o.status='shipped';save();close();render();return}
if(f.getAttribute('id')==='refundForm'){let o=db.orders.find(x=>x.id===str('id'));if(o?.user!==uid()||!['paid','shipped'].includes(o.status)||!str('reason'))return;o.status='refund';o.reason=str('reason');save();close();render();return}
if(f.getAttribute('id')==='settingsForm'){let rate=n('rate'),min=n('minHolder');if(!Number.isFinite(rate)||rate<=0||rate>1e6||!Number.isFinite(min)||min<0||min>1e9)return;db.settings.rate=rate;db.settings.minHolder=min;save();flash(L('参数已保存','Settings saved','設定を保存しました'));return}
});
window.addEventListener('storage',e=>{if(e.key===DBKEY){try{db=JSON.parse(e.newValue)||seed();close();render()}catch{}}});
render();
</script></body></html>
